       '<div class="btnRow"><button class="ghostBtn" data-act="pick">Choose backup file</button>'+
       '<button class="ghostBtn" data-act="restore">Restore</button></div></div>';

  h += '<div class="setting col"><span>Safety snapshots</span>';
  if (!SNAPS.length){
    h += '<p class="hint" style="margin:0">None yet. A snapshot is taken at the start of each training day and before anything that erases or replaces data. The last 6 are kept.</p>';
  } else {
    h += '<div class="dayList" style="margin-top:0">';
    SNAPS.forEach(function(sn, k){
      h += '<div class="snapRow"><span><b>'+dayLabel(sn.at)+', '+clockLabel(sn.at)+'</b><small>'+esc(sn.why)+' · '+sn.n+' workout(s)</small></span>'+
           '<button class="ghostBtn" data-act="snapRestore" data-k="'+k+'">Restore</button></div>';
    });
    h += '</div><p class="hint">Restoring is safe — your current state is snapshotted first. Snapshots live in this browser, so they don\'t replace a downloaded backup.</p>';
  }
  h += '</div>';

  if (!S.iconDone) h += '<div class="setting col"><span>Getting the new app icon</span>'+
       '<p class="hint" style="margin:0">iPhones only pick up a new icon when the app is added to the Home Screen again — and removing the old icon deletes its data. So in this order:</p>'+
       '<ol class="steps"><li>Tap <b>Back up now</b> above and save the file.</li>'+
       '<li>Long-press the old icon ▸ Remove App ▸ Delete from Home Screen.</li>'+
       '<li>Open your link in Safari ▸ Share ▸ Add to Home Screen.</li>'+
       '<li>Open the new icon ▸ ⋮ ▸ Choose backup file ▸ pick the file you saved.</li></ol>'+
       '<p class="hint">Skipping this is fine too — the old icon still runs the latest version.</p>'+
       '<button class="ghostBtn more" data-act="iconDone">Done — hide this</button></div>';

  h += '<div class="setting col"><span>Using this without Claude</span>'+
       '<p class="hint">The app is three files in your GitHub repo — index.html, sw.js (lets it open with no signal) and the icon. '+
       'It needs no subscription and no account. Your workouts live on this phone, not in those files, so uploading a new version never touches them.</p></div>';

  h += '<button class="danger" data-act="reset">Erase all data…</button>'+
       '<button class="ghostBtn wide" data-act="closeSheet">Close</button>';
  return wrapSheet("settings", "closeSheet", h);
}

/* ----------------------------- actions --------------------------- */
function confetti(){
  try {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var wrap = document.createElement("div");
    wrap.className = "confetti";
    var colors = ["#3D7DF6","#31B47C","#E5B23C","#CF5B52","#9B6BE0","#EDEFF2"];
    for (var i=0;i<80;i++){
      var b = document.createElement("i");
      b.style.left = (Math.random()*100)+"%";
      b.style.background = colors[i % colors.length];
      b.style.animationDelay = (Math.random()*0.5)+"s";
      b.style.animationDuration = (1.8+Math.random()*1.4)+"s";
      b.style.transform = "rotate("+(Math.random()*360)+"deg)";
      if (i % 3 === 0) b.style.borderRadius = "50%";
      wrap.appendChild(b);
    }
    document.body.appendChild(wrap);
    setTimeout(function(){ if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 3600);
  } catch(e){}
}

var wakeLock = null;
function keepAwake(on){
  try {
    if (on && S.keepAwake && navigator.wakeLock && !wakeLock){
      navigator.wakeLock.request("screen").then(function(w){
        if (!S.rest){ w.release().catch(function(){}); return; }   /* timer ended before the lock arrived */
        wakeLock = w;
        w.addEventListener("release", function(){ wakeLock = null; });
      }).catch(function(){});
    } else if (!on && wakeLock){
      wakeLock.release().catch(function(){});
      wakeLock = null;
    }
  } catch(e){}
}

function beep(){
  try {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx){
      if (audioCtx.state === "suspended") audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.frequency.value = 660;
      g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.7);
      o.start(); o.stop(audioCtx.currentTime+0.72);
      for (var b=1;b<3;b++){
        var o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
        o2.connect(g2); g2.connect(audioCtx.destination);
        o2.frequency.value = 660 + b*110;
        var t0 = audioCtx.currentTime + b*0.42;
        g2.gain.setValueAtTime(0.0001, t0);
        g2.gain.exponentialRampToValueAtTime(0.25, t0+0.02);
        g2.gain.exponentialRampToValueAtTime(0.0001, t0+0.5);
        o2.start(t0); o2.stop(t0+0.52);
      }
    }
  } catch(e){}
  if (navigator.vibrate) navigator.vibrate([180,90,180]);
}
function primeAudio(){
  try {
    if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch(e){}
}
function startRest(sec, label, kind){
  primeAudio(); beeped = false; keepAwake(true);
  S.rest = {end: Date.now()+sec*1000, label:label, kind:kind || "rest"};
  renderDock();
  clearInterval(tickTimer);
  tickTimer = setInterval(tickRest, 250);
  save();
}
/* a timer that was running when the app closed or reloaded carries on */
function resumeRest(){
  beeped = S.rest.end <= Date.now();
  keepAwake(true); renderDock();
  clearInterval(tickTimer);
  tickTimer = setInterval(tickRest, 250);
}
function stopRest(){ var was = !!S.rest; S.rest = null; clearInterval(tickTimer); keepAwake(false); renderDock(); if (was) save(); }

function tickSet(i,si){
  var s = current(), e = s.ex[i], l = S.log[i], st = l.sets[si], wasDone = st.done;
  var nothingYet = doneSets() === 0;
  st.done = !st.done;
  if (st.done){
    st.t = new Date().toISOString();
    if (!st.w) st.w = hintW(i, si);
    if (!st.r) st.r = e.reps.replace(/[^0-9]/g,"");
    /* a clock left running from an earlier day (e.g. warm-up only) restarts with the first set */
    if (!S.started || (nothingYet && !sameDay(S.started))) S.started = st.t;
    S.rpeAsk = (si === e.sets-1) ? {i:i, n:e.n, target:e.rpe, hist:null} : null;
  } else st.t = null;
  var all = l.sets.every(function(x){return x.done;});
  if (all) l.status = "done";
  else if (l.status === "done") l.status = "todo";

  if (!wasDone){
    if (si < e.sets-1) startRest(e.sec, e.n);
    else {
      stopRest();
      /* next unfinished exercise, wrapping round to any you skipped earlier */
      for (var k = 1; k < S.log.length; k++){
        var j = (i + k) % S.log.length;
        if (S.log[j].status === "todo"){ S.open = j; break; }
      }
    }
  }
  /* every exercise either finished or flagged → the workout is over */
  var allDone = S.log.every(function(x){
    return x.status === "flag" || x.sets.every(function(y){ return y.done; });
  });
  if (!wasDone && allDone && doneSets() > 0){ finishWorkout(); return; }

  render(); renderDock(); save();
  if (!wasDone && si === e.sets-1){
    var el = document.getElementById("card"+S.open);
    if (el && el.scrollIntoView) setTimeout(function(){ el.scrollIntoView({behavior:"smooth", block:"start"}); }, 60);
  }
}

function minutesLabel(m){ return m ? " in "+m+(m===1?" minute":" minutes") : ""; }

function finishWorkout(){
  var s = current();
  /* a session left open for hours (or days) is dated by its last set, not by when you tapped Finish */
  var lastT = 0;
  S.log.forEach(function(l){ l.sets.forEach(function(x){ if (x.t) lastT = Math.max(lastT, new Date(x.t).getTime()); }); });
  var ended = (lastT && Date.now() - lastT > 2*3600000) ? new Date(lastT) : new Date();
  var mins = S.started ? Math.max(1, Math.round((ended.getTime()-new Date(S.started).getTime())/60000)) : null;
  var rec = { sid:s.sid, plan:s.plan, extra:!!s.extra, week:s.extra?0:s.week, day:s.day, name:s.name,
    date:ended.toISOString(), started:S.started, mins:mins, cycle:S.cycle,
    ex: s.ex.map(function(e,i){
      var l = S.log[i];
      var out = { n:e.n, status: l.status==="flag" ? "flag" : (l.sets.some(function(x){return x.done;}) ? "done" : "skip"),
               sets: l.sets.map(function(x){ return {w:x.w, r:x.r, done:x.done, t:x.t}; }) };
      if (l.rpe) out.rpe = l.rpe;
      if (e.orig) out.o = e.orig;
      return out;
    })};
  S.undo = JSON.parse(JSON.stringify({log:S.log, started:S.started, pos:S.pos, plan:S.plan, round:S.round, cycle:S.cycle,
            extra:S.extra, nextPlan:S.nextPlan, warm:S.warm, parked:S.parked, open:S.open}));
  S.undo.rec = rec;
  if (S.rpeAsk) S.rpeAsk.hist = rec.date;

  /* newest first, kept in date order — nothing is ever trimmed (the sort is stable, so ties keep newest first) */
  S.history.unshift(rec);
  S.history.sort(function(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });

  if (s.extra){
    S.extra = null;
    var back = planSession(S.plan, S.pos);
    S.finished = "Extra session logged"+minutesLabel(mins)+". Back to your plan: week "+back.week+", "+back.name+".";
  } else if (S.pos + 1 >= planLength(S.plan)){
    S.round += 1; S.cycle += 1;
    if (S.nextPlan !== "same") S.plan = S.nextPlan;
    S.pos = 0; S.nextPlan = "same";
    var nx = planSession(S.plan, 0);
    S.finished = "That's all 8 weeks. Round "+S.round+" starts with "+nx.name+" on the "+PROGRAMS[S.plan].name+" plan.";
  } else {
    S.pos += 1;
    var nxt = planSession(S.plan, S.pos);
    S.finished = rec.name+" logged"+minutesLabel(mins)+". Next up: "+nxt.name+", week "+nxt.week+".";
  }
  var rpeAsk = S.rpeAsk;
  if (!unpark()) newSession();
  S.rpeAsk = rpeAsk;
  stopRest();
  render(); renderDock(); save();
  confetti();
  window.scrollTo({top:0, behavior:"smooth"});
  /* end of a training week, or a week since the last backup → save one now, once a day at most */
  var weekEnd = !s.extra && s.day === PROGRAMS[s.plan].days;
  if (S.autoBackup && (weekEnd || backupStale()) && !(S.autoAsked && sameDay(S.autoAsked))){
    S.autoAsked = new Date().toISOString(); save();
    saveBackup(true);
  }
}

function undoFinish(){
  var u = S.undo;
  if (!u) return;
  var k = S.history.indexOf(u.rec);
  if (k !== -1){
    S.history[k].ex.forEach(function(x,j){ if (x.rpe && u.log[j]) u.log[j].rpe = x.rpe; });   /* keep an RPE picked after finishing */
    S.history.splice(k, 1);
  }
  S.log = u.log; S.started = u.started; S.pos = u.pos; S.plan = u.plan; S.round = u.round; S.cycle = u.cycle;
  S.extra = u.extra; S.nextPlan = u.nextPlan; S.warm = u.warm; S.parked = u.parked; S.open = u.open;
  if (S.rpeAsk) S.rpeAsk.hist = null;
  S.undo = null; S.finished = null; S.note = "";
  render(); renderDock(); save();
}

/* An extra day pauses the plan session — anything already logged there waits, untouched */
function park(){ if (!S.extra) S.parked = {log:S.log, started:S.started, warm:S.warm}; }
function unpark(){
  var pk = S.parked; S.parked = null;
  if (!pk || S.extra || !Array.isArray(pk.log) || pk.log.length !== current().ex.length) return false;
  S.log = pk.log; S.started = pk.started; S.warm = pk.warm || freshWarm(); S.open = firstTodo(); S.rpeAsk = null;
  return true;
}

/* change split at any point in the cycle */
function switchPlan(key, carry){
  var week = planSession(S.plan, S.pos).week;
  S.plan = key;
  S.pos = carry ? Math.min((week-1) * PROGRAMS[key].days, planLength(key)-1) : 0;
  S.cycle += 1;
  S.extra = null; S.parked = null; S.nextPlan = "same"; S.switchTo = null; S.sheet = false; S.undo = null;
  newSession();
  var nx = planSession(S.plan, S.pos);
  S.finished = "Now on " + PROGRAMS[key].name + " — week " + nx.week + ", starting with " + nx.name + ".";
  render(); renderModal(); save();
  window.scrollTo({top:0});
}

function jumpTo(p){
  S.extra = null; S.parked = null; S.pos = p;
  S.pending = null; S.sheet = false; S.finished = null;
  newSession(); render(); renderModal(); save();
}
function startExtra(day){
  park();
  S.extra = {plan:S.pick.plan, block:S.pick.block, day:day};
  S.pending = null; S.sheet = false; S.finished = null;
  newSession(); render(); renderModal(); save();
  window.scrollTo({top:0});
}
function backToPlan(){
  S.extra = null; S.pending = null; S.finished = null;
  if (!unpark()) newSession();
  stopRest(); render(); renderModal(); save();
}

/* --------------------------- export/import ----------------------- */
function backupObject(){
  var b = stateBlob(); b.app = "fundamentals-tracker"; b.exported = new Date().toISOString(); return b;
}
function stamp(){ return localDate(new Date().toISOString()); }
/* returns true when the file was handed to the browser */
function download(name, text, mime){
  try {
    var blob = new Blob([text], {type: mime+";charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
    S.note = "File created — check your downloads.";
    return true;
  } catch(e){ S.note = "Download blocked here. Use Copy backup instead."; return false; }
}
/* Opens the iPhone share sheet when there is one (pick Save to Files ▸ iCloud Drive), otherwise downloads.
   Has to run straight from a tap: phones only allow sharing and downloading from one. */
function saveBackup(auto){
  var name = "workout-backup-"+stamp()+".json", text = JSON.stringify(backupObject(), null, 2), file = null;
  var okMsg = auto ? "Weekly backup saved." : "Backup saved.";
  function done(msg){ S.lastBackup = new Date().toISOString(); S.note = msg; save(); render(); renderModal(); }
  function fallback(){
    if (download(name, text, "application/json")) done((auto ? "Weekly backup" : "Backup")+" file created — check your downloads.");
    else { render(); renderModal(); }
  }
  try { file = new File([text], name, {type:"application/json"}); } catch(e){ file = null; }
  var canShare = false;
  try { canShare = !!(file && navigator.share && navigator.canShare && navigator.canShare({files:[file]})); } catch(e){ canShare = false; }
  if (!canShare){ fallback(); return; }
  navigator.share({files:[file], title:"Workout backup"}).then(function(){ done(okMsg); }).catch(function(err){
    if (err && err.name === "AbortError"){ S.note = "Backup not saved — the share sheet was closed. Tap Back up now to try again."; render(); renderModal(); }
    else fallback();
  });
}
function toCSV(){
  var rows = [["date","time","program","week","day","workout","exercise","status","set","weight","unit","reps","set_time","last_set_rpe"]];
  S.history.slice().reverse().forEach(function(r){
    var pname = PROGRAMS[r.plan||"LU"] ? PROGRAMS[r.plan||"LU"].name : (r.plan||"");
    r.ex.forEach(function(e){
      e.sets.forEach(function(st,i){
        rows.push([localDate(r.date), clockLabel(r.date), (r.extra?"Extra — ":"")+pname, r.week||"", r.day,
                   r.name, e.n, e.status, i+1, st.w||"", S.unit, st.r||"", st.t?clockLabel(st.t):"",
                   (i === e.sets.length-1 && e.rpe) ? e.rpe : ""]);
      });
    });
  });
  return rows.map(function(r){
    return r.map(function(c){ c=String(c); return /[",\n]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c; }).join(",");
  }).join("\n");
}
function copyBackup(){
  var txt = JSON.stringify(backupObject());
  var box = document.getElementById("restoreBox");
  if (box){ box.value = txt; box.focus(); box.select(); }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ S.lastBackup = new Date().toISOString(); save(); S.note = "Backup copied to your clipboard."; renderModal(); })
      .catch(function(){ S.note = "Couldn't copy automatically — the text is selected below, copy it by hand."; renderModal(); });
  } else { S.note = "The text is in the box below — copy it by hand."; renderModal(); }
}
function restoreFrom(text){
  var data;
  try { data = JSON.parse(text); } catch(e){ S.note = "That doesn't look like a backup file."; renderModal(); return; }
  if (!data || !Array.isArray(data.history)){ S.note = "That backup is missing its history."; renderModal(); return; }
  snapshot("before restoring a backup");
  if (data.exported) data.lastBackup = data.exported;
  applyData(data, "Restored " + data.history.length + " saved workout(s).");
}
function asObj(x){ return (x && typeof x === "object" && !Array.isArray(x)) ? x : {}; }
/* drop anything that isn't a well-formed workout, so one bad entry can't break the app */
function cleanHistory(list){
  if (!Array.isArray(list)) return [];
  return list.filter(function(r){
    return r && typeof r.date === "string" && !isNaN(new Date(r.date).getTime()) && Array.isArray(r.ex) &&
           r.ex.every(function(e){ return e && typeof e.n === "string" && Array.isArray(e.sets); });
  }).sort(function(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
}
/* one loader for everything: app start, backup restore and snapshot restore */
function loadState(data){
  S.history = cleanHistory(data.history);
  S.notes = asObj(data.notes); S.swaps = asObj(data.swaps); S.pbs = asObj(data.pbs); S.steps = asObj(data.steps);
  S.lastBackup = data.lastBackup || null;
  S.keepAwake = data.keepAwake !== false;
  S.unit = data.unit === "lb" ? "lb" : "kg";
  S.plan = PROGRAMS[data.plan] ? data.plan : "LU";
  S.round = Number(data.round) > 0 ? Number(data.round) : 1;
  S.cycle = Number(data.cycle) > 0 ? Number(data.cycle) : 1;
  S.nextPlan = data.nextPlan && (data.nextPlan==="same" || PROGRAMS[data.nextPlan]) ? data.nextPlan : "same";
  S.pos = Math.min(Math.max(Number(data.pos)||0, 0), planLength(S.plan)-1);
  var act = asObj(data.active);
  S.extra = act.extra && PROGRAMS[act.extra.plan] && PROGRAMS[act.extra.plan][act.extra.block] ? act.extra : null;
  S.parked = act.parked && Array.isArray(act.parked.log) ? act.parked : null;
  var sess = current();
  var ok = Array.isArray(act.log) && act.log.length === sess.ex.length;
  S.log = ok ? act.log : blankLog(sess);
  S.started = ok ? (act.started || null) : null;
  S.warm = act.warm && Array.isArray(act.warm.items) ? act.warm : freshWarm();
  /* opened on a new day with nothing logged: don't carry yesterday's clock or warm-up over */
  if (S.started && !sameDay(S.started) && doneSets() === 0){ S.started = null; S.warm = freshWarm(); }
  S.open = firstTodo(); S.undo = null; S.rpeAsk = null;
  S.pick.block = current().week > 4 ? "B" : "A";
  var rs = act.rest;
  S.rest = rs && typeof rs.end === "number" && rs.end > Date.now() - 5*60000 ?
    {end:rs.end, label:String(rs.label || ""), kind:rs.kind === "hold" ? "hold" : "rest"} : null;
  S.autoBackup = data.autoBackup !== false;
  S.iconDone = data.iconDone === true;
  S.autoAsked = typeof data.autoAsked === "string" ? data.autoAsked : null;
  S.backupSnooze = typeof data.backupSnooze === "string" ? data.backupSnooze : null;
}
function applyData(data, msg){
  var keepBackup = S.lastBackup;
  loadState(data);
  S.lastBackup = S.lastBackup || keepBackup;
  S.note = msg;
  stopRest(); render(); renderModal(); save();
}

/* ---------------------------- events ----------------------------- */
/* Every tappable thing carries data-act="name"; this table says what each name does.
   Handlers get the element plus its data-i (exercise) and data-s (set) as numbers. */
function attr(t, k){ return t.getAttribute(k); }
function numAttr(t, k){ var v = t.getAttribute(k); return v === null ? null : parseInt(v, 10); }
function swapped(fn){                 /* run a change to S.swaps, keeping today's other exercises */
  var before = current().ex.map(function(e){ return e.n; });
  fn();
  relog(before);
  S.swapFor = null;
  render(); renderModal(); save();
}
/* swap the exercise the swap sheet is open for; null (or its own name) puts the original back */
function setSwap(to){
  var orig = baseName(current().ex[S.swapFor]);
  S.open = S.swapFor;
  swapped(function(){ if (!to || to === orig) delete S.swaps[orig]; else S.swaps[orig] = to; });
}
function eraseEverything(){
  snapshot("before erasing everything");
  S.confirmErase = false; S.sheet = false; S.finished = null; S.undo = null;
  S.history = []; S.plan = "LU"; S.pos = 0; S.round = 1; S.cycle = 1; S.nextPlan = "same";
  S.extra = null; S.parked = null;
  S.notes = {}; S.swaps = {}; S.pbs = {}; S.steps = {};
  newSession(); render(); renderModal(); save();
}

var ACTIONS = {
  /* --- logging --- */
  toggleOpen: function(t,i){ S.open = (S.open===i ? -1 : i); render(); },
  tick: function(t,i,si){ tickSet(i,si); },
  flag: function(t,i){ var l = S.log[i]; l.status = (l.status==="flag" ? "todo" : "flag"); render(); save(); },
  slash: function(t,i,si){
    var inp = document.querySelector('input[data-f="w"][data-i="'+i+'"][data-s="'+si+'"]');
    if (inp){ inp.value += "/"; S.log[i].sets[si].w = inp.value; inp.focus(); save(); }
  },
  addWeight: function(t,i){ S.log[i].showW = true; render(); },
  repeat: function(t,i){
    var rf = lastRef(current().ex[i], i, prevRecord(current().sid));
    if (!rf) return;
    S.log[i].sets.forEach(function(st,k){
      var src = rf.ex.sets[k] || rf.ex.sets[rf.ex.sets.length-1];
      if (src){ if (!st.w) st.w = src.w || ""; if (!st.r) st.r = src.r || ""; }
    });
    render(); save();
  },
  rpe: function(t,i){
    var v = numAttr(t, "data-v");
    if (attr(t, "data-src") === "dock" && S.rpeAsk){
      var ask = S.rpeAsk;
      if (ask.hist){
        var rec = S.history.filter(function(r){ return r.date === ask.hist; })[0];
        if (rec && rec.ex[ask.i] && rec.ex[ask.i].n === ask.n) rec.ex[ask.i].rpe = v;
      } else if (S.log[ask.i]) S.log[ask.i].rpe = v;
      S.rpeAsk = null;
    } else if (i !== null && S.log[i]){
      S.log[i].rpe = (S.log[i].rpe === v ? null : v);
    }
    render(); renderDock(); save();
  },
  rpeSkip: function(){ S.rpeAsk = null; renderDock(); },
  step: function(t,i){
    var e = current().ex[i], opts = STEP_OPTS[S.unit];
    S.steps[e.n] = opts[(opts.indexOf(stepFor(e)) + 1) % opts.length];
    render(); save();
  },
  finish: function(){ finishWorkout(); },
  undoFinish: function(){ undoFinish(); },
  clearSession: function(){ newSession(); render(); save(); },
  dismissFinish: function(){ S.finished = null; S.note = ""; render(); },

  /* --- warm-up --- */
  toggleWarm: function(){ warmItems(); S.warm.open = !S.warm.open; render(); save(); },
  warmTick: function(t){
    var items = warmItems(), k = numAttr(t, "data-w");
    items[k] = !items[k];
    if (!S.started && items[k]) S.started = new Date().toISOString();
    render(); save();
  },
  warmAll: function(){
    var items = warmItems(), allOn = items.every(Boolean);
    S.warm.items = items.map(function(){ return !allOn; });
    if (!S.started && !allOn) S.started = new Date().toISOString();
    render(); save();
  },

  /* --- timers --- */
  timer: function(t,i){ var e = current().ex[i]; startRest(e.sec, e.n); },
  hold: function(t,i){ var e = current().ex[i]; startRest(e.timed || 30, e.n, "hold"); },
  restAdd: function(){ if (S.rest){ S.rest.end += 30000; beeped = false; tickRest(); save(); } },
  restStop: function(){ stopRest(); },

  /* --- swaps --- */
  swapOpen: function(t,i){ S.swapFor = i; renderModal(); },
  closeSwap: function(){ S.swapFor = null; renderModal(); },
  swapTo: function(t){ setSwap(attr(t, "data-n")); },
  swapCustom: function(){
    var box = document.getElementById("swapCustom"), to = box ? box.value.trim() : "";
    if (to) setSwap(to);
  },
  swapClear: function(){ setSwap(null); },
  swapClearOne: function(t){ var n = attr(t, "data-n"); swapped(function(){ delete S.swaps[n]; }); },

  /* --- exercise guide --- */
  guideOpen: function(t,i){
    S.guide.open = true; S.sheet = false; S.prog.open = false;
    S.guide.sel = (i !== null && current().ex[i]) ? (guideFor(current().ex[i].n) || {}).n || null : null;
    renderModal();
  },
  guideSel: function(t){
    if (!S.guide.sel) S.guide.listTop = sheetScroll();      /* remember where you were in the list */
    S.guide.sel = attr(t, "data-n"); renderModal();
  },
  guideBack: function(){ S.guide.sel = null; renderModal(); sheetScroll(S.guide.listTop || 0); },
  guideClose: function(){ S.guide.open = false; S.guide.sel = null; S.guide.listTop = 0; renderModal(); },

  /* --- progress sheet --- */
  progOpen: function(t,i){
    S.prog.open = true; S.prog.table = false; S.sheet = false; S.guide.open = false;
    S.prog.tab = (i !== null && current().ex[i]) ? "lifts" : "week";
    if (S.prog.tab === "lifts") S.prog.lift = current().ex[i].n;
    renderModal();
  },
  pbAll: function(){ S.prog.pbAll = !S.prog.pbAll; renderModal(); },
  progTab: function(t){ S.prog.tab = attr(t, "data-t"); renderModal(); },
  musPick: function(t){ var m = attr(t, "data-m"); S.prog.mus = (S.prog.mus === m ? null : m); renderModal(); },
  progClose: function(){ S.prog.open = false; renderModal(); },
  progWeek: function(t){ S.prog.week = numAttr(t, "data-w") || 0; renderModal(); },
  progTable: function(){ S.prog.table = !S.prog.table; renderModal(); },

  /* --- settings sheet --- */
  sheet: function(){
    S.sheet = true; S.note = "";
    if (!S.extra && current().week > 4) S.pick.block = "B";
    renderModal();
  },
  closeSheet: function(){ S.sheet = false; S.note = ""; S.editHist = null; S.delHist = null; renderModal(); },
  pickPlan: function(t){ S.pick.plan = attr(t, "data-k"); renderModal(); },
  pickBlock: function(t){ S.pick.block = attr(t, "data-b"); renderModal(); },
  startExtra: function(t){
    var day = numAttr(t, "data-d");
    if (S.extra && doneSets() > 0){ S.pending = {kind:"extra", day:day}; renderModal(); }
    else startExtra(day);
  },
  backToPlan: function(){
    if (doneSets() > 0){ S.pending = {kind:"back"}; renderModal(); }
    else backToPlan();
  },
  jump: function(t){
    var p = numAttr(t, "data-p");
    if (!S.extra && p === S.pos){ S.sheet = false; renderModal(); }
    else if (doneSets() > 0){ S.pending = {kind:"jump", p:p}; renderModal(); }
    else jumpTo(p);
  },
  confirmPending: function(){
    var pd = S.pending; S.pending = null;
    if (!pd) return;
    if (pd.kind === "jump") jumpTo(pd.p);
    else if (pd.kind === "extra") startExtra(pd.day);
    else if (pd.kind === "back") backToPlan();
  },
  cancelPending: function(){ S.pending = null; renderModal(); },
  switchPlan: function(t){
    var k = attr(t, "data-k");
    if (k === S.plan){ S.sheet = false; renderModal(); }
    else { S.switchTo = k; renderModal(); }
  },
  doSwitch: function(t){ switchPlan(S.switchTo, attr(t, "data-c") === "carry"); },
  cancelSwitch: function(){ S.switchTo = null; renderModal(); },
  nextPlan: function(t){ S.nextPlan = attr(t, "data-k"); renderModal(); save(); },
  unit: function(t){ S.unit = attr(t, "data-u"); render(); renderModal(); save(); },
  awake: function(t){ S.keepAwake = attr(t, "data-v") === "1"; if (!S.keepAwake) keepAwake(false); renderModal(); save(); },
  histOpen: function(t){
    var k = numAttr(t, "data-h"); S.openHist = (S.openHist === k ? null : k); S.editHist = null; S.delHist = null; renderModal();
  },
  logMore: function(){ S.logMore = !S.logMore; S.openHist = null; S.editHist = null; S.delHist = null; renderModal(); },
  histEdit: function(t){
    var rec = S.history[numAttr(t, "data-h")];
    if (rec){ S.editHist = {rec:rec, draft:JSON.parse(JSON.stringify(rec))}; S.delHist = null; S.note = ""; renderModal(); }
  },
  histCancel: function(){ S.editHist = null; renderModal(); },
  histSave: function(){ saveHistEdit(); },
  histTick: function(t){
    var st = S.editHist && S.editHist.draft.ex[numAttr(t, "data-e")].sets[numAttr(t, "data-s")];
    if (st){ st.done = !st.done; renderModal(); }
  },
  histRpe: function(t){
    var e = S.editHist && S.editHist.draft.ex[numAttr(t, "data-e")], v = numAttr(t, "data-v");
    if (e){ if (e.rpe === v) delete e.rpe; else e.rpe = v; renderModal(); }
  },
  histUnflag: function(t){
    var e = S.editHist && S.editHist.draft.ex[numAttr(t, "data-e")];
    if (e){ e.status = "skip"; renderModal(); }
  },
  histDel: function(t){ S.delHist = S.history[numAttr(t, "data-h")] || null; S.editHist = null; renderModal(); },
  histDelNo: function(){ S.delHist = null; renderModal(); },
  histDelYes: function(){ if (S.delHist) deleteHist(S.delHist); },

  /* --- backup, restore, erase --- */
  dlJson: function(){ saveBackup(false); },
  snoozeBackup: function(){ S.backupSnooze = new Date().toISOString(); render(); save(); },
  iconDone: function(){ S.iconDone = true; renderModal(); save(); },
  autoBk: function(t){ S.autoBackup = attr(t, "data-v") === "1"; renderModal(); save(); },
  dlCsv: function(){ download("workout-log-"+stamp()+".csv", toCSV(), "text/csv"); render(); renderModal(); },
  copy: function(){ copyBackup(); },
  pick: function(){ document.getElementById("filePick").click(); },
  restore: function(){
    var box = document.getElementById("restoreBox");
    if (box && box.value.trim()) restoreFrom(box.value.trim());
    else { S.note = "Paste a backup into the box first, or choose a file."; renderModal(); }
  },
  snapRestore: function(t){ restoreSnapshot(numAttr(t, "data-k")); },
  reset: function(){ S.confirmErase = true; renderModal(); },
  cancelErase: function(){ S.confirmErase = false; renderModal(); },
  eraseAll: function(){ eraseEverything(); }
};

document.addEventListener("click", function(ev){
  var t = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (!t) return;
  /* a sheet's dimmed backdrop closes it; taps on the sheet itself never do */
  if (t.classList.contains("sheetWrap") && ev.target !== t) return;
  var fn = ACTIONS[attr(t, "data-act")];
  if (fn) fn(t, numAttr(t, "data-i"), numAttr(t, "data-s"));
});

document.addEventListener("input", function(ev){
  var el = ev.target;
  if (el && el.id === "guideQ"){            /* search filters in place, so the keyboard stays open */
    S.guide.q = el.value;
    var list = document.getElementById("guideList");
    if (list) list.innerHTML = guideListHTML();
    return;
  }
  if (!el || !el.getAttribute || el.getAttribute("data-f") === null) return;
  var f = el.getAttribute("data-f"), i = parseInt(el.getAttribute("data-i"),10);
  if (f === "hw" || f === "hr"){                 /* fixing a past workout: typing never redraws, so the keyboard stays */
    var hs = S.editHist && S.editHist.draft.ex[parseInt(el.getAttribute("data-e"),10)].sets[parseInt(el.getAttribute("data-s"),10)];
    if (hs){ hs[f === "hw" ? "w" : "r"] = el.value.trim(); if (el.value.trim() && !hs.done){ hs.done = true; el.parentNode.className = "hSet on"; var tk = el.parentNode.querySelector(".tick"); if (tk) tk.className = "tick sm on"; } }
    return;
  }
  if (f === "note" || f === "pb"){
    var nm = current().ex[i].n, v = el.value.trim();
    var bag = f === "note" ? S.notes : S.pbs;
    if (v) bag[nm] = v; else delete bag[nm];
    save(); return;
  }
  var si = parseInt(el.getAttribute("data-s"),10);
  S.log[i].sets[si][f] = el.value;
  if (f === "w"){
    for (var k = si+1; k < S.log[i].sets.length; k++){
      var nx = document.querySelector('input[data-f="w"][data-i="'+i+'"][data-s="'+k+'"]');
      if (nx) nx.placeholder = hintW(i, k) || "–";
    }
  }
  save();
});

document.addEventListener("change", function(ev){
  if (ev.target && ev.target.id === "liftPick"){ S.prog.lift = ev.target.value; S.prog.table = false; renderModal(); }
});

document.getElementById("filePick").addEventListener("change", function(ev){
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function(){ restoreFrom(String(fr.result)); };
  fr.onerror = function(){ S.note = "Couldn't read that file."; renderModal(); };
  fr.readAsText(f);
  ev.target.value = "";
});

/* drag a sheet down from its top to close it */
var drag = null;
modalEl.addEventListener("touchstart", function(ev){
  var sh = ev.target.closest ? ev.target.closest(".sheet") : null;
  drag = null;
  if (!sh || sh.scrollTop > 0 || ev.touches.length !== 1) return;
  if (ev.target.closest("input,textarea,select,.liftSvg")) return;
  drag = {sh:sh, y:ev.touches[0].clientY, dy:0};
}, {passive:true});
modalEl.addEventListener("touchmove", function(ev){
  if (!drag) return;
  var dy = ev.touches[0].clientY - drag.y;
  if (dy <= 0 || drag.sh.scrollTop > 0){ drag.sh.style.transform = ""; drag = null; return; }
  drag.dy = dy;
  drag.sh.style.transition = "none";
  drag.sh.style.transform = "translateY("+dy+"px)";
  ev.preventDefault();
}, {passive:false});
function endDrag(){
  if (!drag) return;
  var d = drag; drag = null;
  d.sh.style.transition = "transform .18s ease-out";
  if (d.dy > 90){
    d.sh.style.transform = "translateY(100%)";
    setTimeout(function(){ var fn = ACTIONS[d.sh.getAttribute("data-close")]; if (fn) fn(d.sh, null, null); }, 170);
  } else d.sh.style.transform = "";
}
modalEl.addEventListener("touchend", endDrag);
modalEl.addEventListener("touchcancel", endDrag);

/* switching apps or locking the phone: save immediately, don't wait for the debounce */
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "hidden"){ if (saveTimer) flushSave(); }
  else if (S.rest){ keepAwake(true); tickRest(); }
});
window.addEventListener("pagehide", function(){ if (saveTimer) flushSave(); });

/* if anything ever goes wrong while drawing, say so instead of freezing silently */
window.addEventListener("error", function(){
  if (document.getElementById("crash")) return;
  var d = document.createElement("div");
  d.id = "crash"; d.className = "warn crash";
  d.innerHTML = 'Something went wrong on this screen. Your saved workouts are safe. <button class="ghostBtn" onclick="location.reload()">Reload</button>';
  document.body.appendChild(d);
});

/* ------------------------------ boot ----------------------------- */
/* offline: sw.js (uploaded next to this file) keeps a copy so the app opens with no signal */
try {
  if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
} catch(e){}
detectStore();
readStore().then(function(saved){
  if (saved) loadState(saved);
  else S.log = blankLog(current());
  if (STORE.mode === "memory") S.warn = true;
  render();
  if (S.rest) resumeRest();
  return readKey(SNAP_KEY).then(function(snaps){
    SNAPS = unpackSnaps(snaps);
    if (S.history.length && (!SNAPS.length || !sameDay(SNAPS[0].at))) snapshot("start of day");
    else if (Array.isArray(snaps) && SNAPS.length) persistSnaps();      /* shrink snapshots saved by older versions */
  });
});
</script>
