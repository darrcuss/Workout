<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lower/Upper">
<meta name="theme-color" content="#0E1116">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Fundamentals — Lower/Upper</title>
<style>
:root{--ink:#0E1116;--card:#171C24;--card2:#1F2631;--edge:#2C3644;--chalk:#EDEFF2;--dim:#98A1B0;--blue:#3D7DF6;--green:#31B47C;--amber:#E5B23C;--red:#CF5B52}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink)}
body{color:var(--chalk);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  padding:0 0 calc(220px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
.wrap{max-width:520px;margin:0 auto}
.loading{padding:80px 24px;color:var(--dim);font-size:16px}

.top{position:sticky;top:0;z-index:20;background:rgba(14,17,22,.93);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);padding:calc(14px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--edge)}
.topRow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-size:13px;color:var(--dim)}
.eyebrow.extra{color:var(--amber)}
h1{margin:2px 0 0;font-size:26px;line-height:1.1;font-weight:750;letter-spacing:-.02em}
.iconBtn{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--edge);
  background:var(--card);color:var(--chalk);display:grid;place-items:center;cursor:pointer}
.plates{display:flex;gap:6px;margin:14px 0 10px}
.plateBar{flex:1;height:34px;border-radius:8px;border:1px solid var(--edge);background:var(--card);
  color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;display:grid;place-items:center;padding:0;font-family:inherit}
.plateBar.past{background:var(--card2);color:var(--chalk)}
.plateBar.now{background:var(--blue);border-color:var(--blue);color:#fff}
.pausedBar{display:flex;align-items:center;gap:10px;margin:12px 0 10px;padding:10px 12px;border-radius:12px;
  background:rgba(229,178,60,.12);border:1px solid rgba(229,178,60,.4);font-size:13px;color:#EBD09A;line-height:1.4}
.pausedBar button{flex:none}
.meter{height:4px;border-radius:3px;background:var(--card2);overflow:hidden}
.meterFill{height:100%;background:var(--green);transition:width .25s ease}
.meterText{margin-top:6px;font-size:12.5px;color:var(--dim)}
.ago{color:#77808E}

.warn{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:rgba(207,91,82,.14);
  border:1px solid rgba(207,91,82,.4);color:#F0B7B2;font-size:13.5px;line-height:1.45}
.stale{margin:12px 16px 0;padding:11px 13px;border-radius:12px;background:var(--card);border:1px solid var(--edge);
  font-size:13.5px;line-height:1.45;color:#BFC6D2}
.stale .btnRow{margin-top:10px}
.finishCard{margin:14px 16px 0;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--green)}
.finishTop{font-size:15px;font-weight:700;color:var(--green)}
.finishCard p{margin:6px 0 12px;font-size:14.5px;line-height:1.45}

.list{padding:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--edge);border-radius:16px;background:var(--card);overflow:hidden}
.card.open{border-color:#3B4657}
.card.isDone{border-left:3px solid var(--green)}
.card.isFlag{border-left:3px solid var(--red)}
.cardHead{width:100%;display:flex;align-items:center;gap:12px;padding:14px;background:none;border:0;
  color:inherit;text-align:left;cursor:pointer;font-family:inherit}
.num{flex:none;width:24px;font-size:13px;color:var(--dim);font-weight:600}
.headText{flex:1;min-width:0}
.exName{display:block;font-size:16.5px;font-weight:650;letter-spacing:-.01em;line-height:1.25}
.exMeta{display:block;margin-top:3px;font-size:12.5px;color:var(--dim)}
.exLast{display:block;margin-top:4px;font-size:12px;color:#7C879A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exLast b{color:#AEB7C4;font-weight:650}
.card.open .exLast{white-space:normal}
.badge{flex:none;min-width:34px;height:28px;padding:0 8px;border-radius:9px;background:var(--card2);
  color:var(--dim);font-size:13px;font-weight:650;display:grid;place-items:center}
.badge.done{background:rgba(49,180,124,.16);color:var(--green)}
.badge.flag{background:rgba(207,91,82,.16);color:var(--red)}
.body{padding:14px;border-top:1px solid var(--edge)}
.visual{display:flex;gap:12px;align-items:center}
.art{width:104px;height:74px;flex:none;color:#7F8DA3;background:var(--card2);border-radius:12px;padding:4px}
.cue{margin:0;font-size:13.5px;line-height:1.45;color:#BFC6D2}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.setRow{display:flex;align-items:center;gap:8px}
.setRow.logged input{color:var(--green)}
.setNo{flex:none;width:44px;font-size:13px;color:var(--dim)}
.field{flex:1;display:flex;align-items:center;background:var(--card2);border:1px solid var(--edge);
  border-radius:11px;padding:0 10px;height:46px}
.field input{width:100%;min-width:0;background:none;border:0;outline:none;color:var(--chalk);
  font-size:17px;font-weight:600;font-family:inherit;padding:0}
.field input::placeholder{color:#5C6675;font-weight:500}
.suffix{font-size:12.5px;color:var(--dim);padding-left:4px}
.tick{flex:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--edge);
  background:var(--card2);color:#5C6675;font-size:19px;cursor:pointer;font-family:inherit}
.tick.on{background:var(--green);border-color:var(--green);color:#08130E}
.cardActions{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.miniBtn{border:1px solid var(--edge);background:var(--card2);color:#C6CDD9;border-radius:10px;
  padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;font-family:inherit;display:inline-block}
.miniBtn.on{background:rgba(207,91,82,.18);border-color:var(--red);color:#F0B7B2}
.finishBtn{margin-top:8px;height:54px;border-radius:15px;border:0;background:var(--blue);color:#fff;
  font-size:16.5px;font-weight:700;font-family:inherit;cursor:pointer;width:100%}
.finishBtn:disabled{background:var(--card2);color:#5C6675}
.foot{margin:12px 2px 0;font-size:12.5px;line-height:1.5;color:#727B8A}

#rest{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;
  max-width:496px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#rest:empty{display:none}
.restBar{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-radius:18px;
  background:rgba(31,38,49,.97);border:1px solid var(--edge);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.restBar.up{border-color:var(--green)}
.restLeft{flex:1;min-width:0}
.restTime{font-size:26px;font-weight:750;letter-spacing:-.02em;line-height:1}
.restBar.up .restTime{color:var(--green)}
.restLabel{margin-top:2px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restBtn{flex:none;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--edge);
  background:var(--card);color:var(--chalk);font-size:14px;font-weight:650;font-family:inherit;cursor:pointer}
.restBtn.solid{background:var(--blue);border-color:var(--blue);color:#fff}

.sheetWrap{position:fixed;inset:0;z-index:40;background:rgba(6,8,11,.6);display:flex;align-items:flex-end}
.sheet{width:100%;max-width:520px;margin:0 auto;max-height:calc(100vh - 24px - env(safe-area-inset-top));
  max-height:calc(100dvh - 24px - env(safe-area-inset-top));overflow:auto;overscroll-behavior:contain;background:var(--card);
  border-radius:22px 22px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--edge)}
.dockOn .sheet{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.sheetTop{position:sticky;top:0;z-index:3;height:46px;margin:0 -16px 4px;background:var(--card);border-radius:22px 22px 0 0}
.sheetBar{position:absolute;left:50%;top:9px;width:38px;height:4px;margin-left:-19px;border-radius:3px;background:var(--edge)}
.sheetX{position:absolute;right:12px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--card2);
  color:var(--chalk);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.sheetX svg,.rpeX svg{display:block}
.sheet h2{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.setting{padding:14px 0;border-top:1px solid var(--edge);font-size:15px}
.setting.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.setting>span{display:block}
.setting.col>span{margin-bottom:10px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px}
.seg.full{width:100%}
.seg.full button{flex:1;padding:8px 4px;font-size:13px}
.seg button{border:0;background:none;color:var(--dim);padding:7px 16px;border-radius:8px;font-size:14px;
  font-weight:650;font-family:inherit;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--blue);color:#fff}
.dayList{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dayBtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  border:1px solid var(--edge);background:var(--card2);border-radius:11px;padding:11px 13px;
  color:var(--chalk);font-family:inherit;font-size:14.5px;font-weight:650;cursor:pointer;text-align:left}
.dayBtn small{font-size:12px;color:var(--dim);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.jump{border:1px solid var(--edge);background:var(--card2);color:var(--dim);border-radius:10px;padding:8px 4px;
  font-family:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center}
.jump b{font-size:13px;color:var(--chalk);font-weight:700}
.jump span{font-size:10.5px}
.jump.on{background:var(--blue);border-color:var(--blue)}
.jump.on b,.jump.on span{color:#fff}
.jump.did{border-color:rgba(49,180,124,.55)}
.jump.did b{color:var(--green)}
.logItem{background:var(--card2);border-radius:11px;overflow:hidden}
.logHead{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;background:none;border:0;
  color:inherit;text-align:left;font-family:inherit;cursor:pointer}
.logHead .lt{flex:1;min-width:0}
.logHead b{display:block;font-size:14px;font-weight:650}
.logHead span{display:block;margin-top:2px;font-size:12px;color:var(--dim)}
.pill{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 7px;border-radius:6px;background:rgba(229,178,60,.16);color:var(--amber)}
.logBody{padding:0 12px 12px;font-size:12.5px;line-height:1.6;color:#BFC6D2}
.logBody>div{display:flex;gap:8px;padding:4px 0;border-top:1px solid rgba(255,255,255,.05)}
.logBody>.btnRow{border:0}
.logBody i{flex:1;font-style:normal}
.logBody em{font-style:normal;color:var(--dim);text-align:right;white-space:nowrap}
.logBody em.miss{color:var(--red)}
.more{margin-top:8px}
.hint{margin:10px 0 0;font-size:12.5px;color:#727B8A;line-height:1.5}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{background:var(--card2);border-radius:10px;padding:9px 11px}
.hist b{display:block;font-size:14px;font-weight:650}
.hist span{display:block;margin-top:2px;font-size:12px;color:var(--dim)}
.where{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#BFC6D2;line-height:1.45}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--green);margin-top:5px}
.dot.warnDot{background:var(--red)}
.btnRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
textarea{width:100%;height:110px;margin-top:10px;background:var(--card2);border:1px solid var(--edge);
  border-radius:12px;color:var(--chalk);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
  padding:10px;resize:vertical;-webkit-user-select:text;user-select:text}
.danger{width:100%;margin-top:16px;height:46px;border-radius:12px;border:1px solid rgba(207,91,82,.5);
  background:rgba(207,91,82,.12);color:#F0B7B2;font-size:14.5px;font-weight:650;font-family:inherit;cursor:pointer}
.ghostBtn{border:1px solid var(--edge);background:var(--card2);color:var(--chalk);border-radius:11px;padding:10px 14px;
  font-size:14px;font-weight:650;font-family:inherit;cursor:pointer}
.ghostBtn.wide{width:100%;margin-top:8px;height:46px}
.ok{color:var(--green)}
.crash{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:70;max-width:496px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:10px;background:#2A1B1B}

/* --- warm-up --- */
.card.warm .num{font-size:16px;color:var(--amber)}
.warmRow{display:flex;align-items:center;gap:10px}
.warmRow .wt{flex:1;min-width:0}
.warmRow .wt b{display:block;font-size:14.5px;font-weight:650}
.warmRow .wt i{display:block;margin-top:2px;font-size:12px;color:var(--dim);font-style:normal;line-height:1.4}
.warmRow.logged .wt b{color:var(--green)}

/* --- notes, PB, swap --- */
.twoUp{display:flex;gap:8px;margin-top:12px}
.miniField{flex:1;min-width:0;display:block}
.miniField span{display:block;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:#77808E;margin-bottom:5px}
.miniField input{width:100%;background:var(--card2);border:1px solid var(--edge);border-radius:11px;
  color:var(--chalk);font-size:15px;font-family:inherit;padding:11px 10px;outline:none}
.miniField input::placeholder{color:#5C6675}
.pbLine{margin-top:8px;font-size:12.5px;color:var(--dim)}
.pbLine b{color:var(--amber)}
.noteChip{color:#AEB7C4}
.swapTag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle;
  padding:2px 6px;border-radius:5px;background:rgba(61,125,246,.18);color:#9DBDFB;margin-left:6px}
.dayBtn.picked{border-color:var(--blue)}
.dayBtn small.star{color:var(--amber);white-space:nowrap;flex:none}
.slash{flex:none;width:26px;height:30px;margin-right:2px;border:0;border-radius:7px;background:rgba(255,255,255,.06);
  color:#8A94A3;font-size:15px;font-family:inherit;cursor:pointer;padding:0}
.bwTag{flex:1;height:46px;border:1px dashed var(--edge);background:none;border-radius:11px;color:#77808E;
  font-size:13px;font-family:inherit;cursor:pointer}
.bwTag b{color:#AEB7C4;font-size:15px}
.tick.hold{background:var(--card2);color:var(--amber);font-size:14px}


/* --- header buttons --- */
.topBtns{display:flex;gap:8px;flex:none}

/* --- next-time target --- */
.exNext{display:block;margin-top:3px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.exNext i{font-style:normal;display:inline-block;width:12px}
.exNext.up{color:var(--green)}
.exNext.down{color:var(--amber)}
.target{margin-top:12px;padding:10px 12px;border-radius:11px;background:var(--card2);border-left:3px solid var(--dim)}
.target.up{border-left-color:var(--green)}
.target.down{border-left-color:var(--amber)}
.target b{display:block;font-size:14.5px;font-weight:700}
.target span{display:block;margin-top:3px;font-size:12.5px;line-height:1.45;color:#BFC6D2}
.stepChip{margin-top:8px;border:1px solid var(--edge);background:var(--card);color:var(--chalk);border-radius:8px;
  padding:6px 10px;font-size:12.5px;font-weight:650;font-family:inherit;cursor:pointer}
.stepChip i{font-style:normal;color:var(--dim);font-weight:500;margin-left:4px}

/* --- RPE --- */
.rpeRow{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rpeRow>span{font-size:13px;color:#BFC6D2}
.rpeRow>span i{font-style:normal;color:var(--dim);margin-left:4px}
.chips{display:flex;gap:6px}
.chip{min-width:40px;height:36px;padding:0 8px;border-radius:10px;border:1px solid var(--edge);background:var(--card2);
  color:var(--chalk);font-size:14px;font-weight:650;font-family:inherit;cursor:pointer}
.chip.tgt{border-color:#5B6678}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.rpeAsk{position:relative;padding:12px 40px 12px 14px;border-radius:18px;background:rgba(31,38,49,.98);
  border:1px solid var(--blue);box-shadow:0 12px 30px rgba(0,0,0,.45)}
.rpeQ{display:flex;flex-direction:column;margin-bottom:9px}
.rpeQ span{font-size:14px;font-weight:650}
.rpeQ b{font-size:12px;color:var(--dim);font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpeAsk .chips{gap:6px}
.rpeAsk .chip{flex:1;min-width:0;height:42px}
.rpeX{position:absolute;top:6px;right:6px;width:32px;height:32px;border:0;background:none;color:var(--dim);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

/* --- progress sheet --- */
.picker{width:100%;height:44px;border-radius:11px;border:1px solid var(--edge);background:var(--card2);color:var(--chalk);
  font-size:15.5px;font-weight:650;font-family:inherit;padding:0 12px;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#8A94A3 50%),linear-gradient(135deg,#8A94A3 50%,transparent 50%);
  background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.pStats{display:flex;gap:8px;margin:12px 0 0}
.vsNote{margin:6px 0 12px!important;font-size:11.5px!important}
.pStats+.legend{margin-top:12px}
.pStats>div{flex:1;min-width:0;background:var(--card2);border-radius:11px;padding:9px 11px}
.pStats small{display:block;font-size:11px;color:var(--dim)}
.pStats b{display:block;margin-top:2px;font-size:19px;font-weight:700;font-variant-numeric:normal}
.pStats b.sm{font-size:14px;line-height:1.3}
.pStats i{display:block;margin-top:1px;font-size:11.5px;font-style:normal;color:#77808E}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:#BFC6D2;margin:2px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lk{display:inline-block;width:14px;height:3px;border-radius:2px}
.lk.tick{width:2px;height:12px;background:#8A94A3}
.readout{font-size:12.5px;font-weight:600;color:var(--chalk);min-height:18px;margin:4px 0 2px}
.liftSvg{display:block;width:100%;height:auto;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.liftSvg .axis{font-size:10px;fill:#77808E;font-variant-numeric:tabular-nums}
.liftSvg .endTxt{font-size:10.5px;font-weight:600;fill:#BFC6D2}
.liftSvg .pbTxt{font-size:10px;font-weight:700;fill:#EDEFF2;letter-spacing:.04em}
.ptable{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.ptable th{text-align:left;font-weight:600;color:var(--dim);font-size:11.5px;padding:6px 4px;border-bottom:1px solid var(--edge)}
.ptable td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.05);font-variant-numeric:tabular-nums}
.mbars{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.mrow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:inherit;font-family:inherit;
  padding:4px 4px;border-radius:8px;cursor:pointer;text-align:left}
.mrow.on{background:var(--card2)}
.mname{flex:none;width:112px;font-size:13px;color:#BFC6D2}
.mtrack{position:relative;flex:1;height:12px}
.mfill{position:absolute;left:0;top:0;bottom:0;background:#3987e5;border-radius:0 4px 4px 0}
.mplan{position:absolute;top:-3px;bottom:-3px;width:2px;background:#8A94A3;border-radius:1px}
.mval{flex:none;width:66px;text-align:right;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.mval small{font-size:12px;color:var(--dim);font-weight:500}


/* --- swapped card + guide --- */

.chipLink{border:1px solid var(--edge);background:var(--card2);color:#C6CDD9;border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit;cursor:pointer}

b.late,.nudge.late{color:var(--amber)}
b.fresh{color:var(--green)}

/* --- confetti --- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(680deg);opacity:.15}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
@media (prefers-reduced-motion:reduce){.meterFill{transition:none}}

          sid:planKey+"-"+block+"-"+day, name:s.name, tag:s.tag, ex:s.ex,
          weekday:pr.sched[day-1], extra:false};
}

/* ---------------------------- storage ---------------------------- */
var KEY = "fundamentals_lower_upper_v1";
var SNAP_KEY = KEY + "_snapshots";
var STORE = { mode:"memory", mem:{}, unreadable:false };

function detectStore(){
  if (window.storage && typeof window.storage.get === "function"){ STORE.mode = "claude"; return; }
  try { window.localStorage.setItem("__t","1"); window.localStorage.removeItem("__t"); STORE.mode = "local"; }
  catch(e){ STORE.mode = "memory"; }
}
function readKey(key){
  if (STORE.mode === "claude"){
    return Promise.resolve().then(function(){ return window.storage.get(key, false); })
      .then(function(r){ return (r && r.value) ? JSON.parse(r.value) : null; })
      .catch(function(){ return null; });
  }
  if (STORE.mode === "local"){
    var v = null;
    try { v = window.localStorage.getItem(key); return Promise.resolve(v ? JSON.parse(v) : null); }
    catch(e){
      /* unreadable data is set aside, never silently overwritten */
      try { if (v && !window.localStorage.getItem(key+"_unreadable")) window.localStorage.setItem(key+"_unreadable", v); } catch(e2){}
      if (key === KEY && v) STORE.unreadable = true;
      return Promise.resolve(null);
    }
  }
  return Promise.resolve(STORE.mem[key] ? JSON.parse(STORE.mem[key]) : null);
}
function writeKey(key, obj){
  var txt = JSON.stringify(obj);
  if (STORE.mode === "claude"){
    return Promise.resolve().then(function(){ return window.storage.set(key, txt, false); })
      .then(function(){ return true; })
      .catch(function(){ return false; });
  }
  if (STORE.mode === "local"){
    try { window.localStorage.setItem(key, txt); return Promise.resolve(true); }
    catch(e){ return Promise.resolve(false); }
  }
  STORE.mem[key] = txt;
  return Promise.resolve(false);
}
function readStore(){ return readKey(KEY); }
function writeStore(obj){ return writeKey(KEY, obj); }

/* ---------------------------- snapshots ---------------------------
   Up to 6 full copies of your data, kept next to it in this browser:
   one at the start of each training day, plus one before anything that
   wipes or replaces data. They vanish if Safari's site data is cleared,
   so they complement the downloaded backup — they don't replace it.   */
var SNAPS = [];
/* returns true when a snapshot was taken (saving happens in the background) */
function snapshot(why){
  if (!S.history.length && !Object.keys(S.notes).length && !Object.keys(S.pbs).length) return false;
  SNAPS.unshift({at:new Date().toISOString(), why:why, n:S.history.length,
                 data: JSON.parse(JSON.stringify(stateBlob()))});
  SNAPS = SNAPS.slice(0, 6);
  persistSnaps();
  return true;
}
/* On disk, a workout that appears in several snapshots is stored once; each snapshot keeps a list of keys.
   The key includes a fingerprint of the workout, so an edited workout is kept in both versions. */
function recKey(r){
  var txt = JSON.stringify(r), h = 5381;
  for (var i = 0; i < txt.length; i++) h = ((h << 5) + h + txt.charCodeAt(i)) | 0;
  return r.date + "#" + (h >>> 0).toString(36);
}
function packSnaps(){
  var pack = {v:2, recs:{}, snaps:[]};
  SNAPS.forEach(function(sn){
    var d = {};
    Object.keys(sn.data).forEach(function(k){ if (k !== "history") d[k] = sn.data[k]; });
    d.hist = (sn.data.history || []).map(function(r){ var k = recKey(r); pack.recs[k] = r; return k; });
    pack.snaps.push({at:sn.at, why:sn.why, n:sn.n, data:d});
  });
  return pack;
}
function unpackSnaps(x){
  if (Array.isArray(x)) return x;                       /* older format: one full copy per snapshot */
  if (!x || x.v !== 2 || !Array.isArray(x.snaps)) return [];
  return x.snaps.map(function(sn){
    var d = {};
    Object.keys(sn.data || {}).forEach(function(k){ if (k !== "hist") d[k] = sn.data[k]; });
    d.history = ((sn.data && sn.data.hist) || []).map(function(k){ return x.recs[k]; }).filter(Boolean);
    return {at:sn.at, why:sn.why, n:sn.n, data:d};
  });
}
function persistSnaps(){
  return writeKey(SNAP_KEY, packSnaps()).then(function(ok){
    if (!ok && STORE.mode !== "memory" && SNAPS.length > 1){ SNAPS.pop(); return persistSnaps(); }
    return ok;
  });
}
function restoreSnapshot(idx){
  var snap = SNAPS[idx];
  if (!snap) return;
  var data = JSON.parse(JSON.stringify(snap.data)), when = dayLabel(snap.at)+", "+clockLabel(snap.at);
  var kept = snapshot("before restoring a snapshot");
  applyData(data, "Restored the snapshot from "+when+"."+(kept ? " The state you just left is saved as a snapshot too." : ""));
}
function backupAge(){ return S.lastBackup ? Math.max(0, daysAgo(S.lastBackup)) : null; }
function backupText(){
  var d = backupAge();
  if (d === null) return "Not backed up yet";
  if (d === 0) return "Backed up today";
  if (d === 1) return "Last backup yesterday";
  return "Last backup " + d + " days ago";
}
function backupStale(){ var d = backupAge(); return S.history.length > 0 && (d === null || d >= 7); }

function newSession(){
  S.log = blankLog(current());
  S.started = null; S.open = 0; S.rpeAsk = null;
  S.warm = freshWarm();
  stopRest();
}
/* after a swap: rebuild the log but keep every exercise whose movement didn't change */
function relog(namesBefore){
  var sess = current();
  S.log = sess.ex.map(function(e, k){
    return (namesBefore[k] === e.n && S.log[k]) ? S.log[k] : blankLog({ex:[e]})[0];
  });
}
function firstTodo(){
  var k = S.log.findIndex(function(l){ return l.status === "todo"; });
  return k === -1 ? 0 : k;
}
function blankLog(sess){
  return sess.ex.map(function(e){
    var sets = [];
    for (var i=0;i<e.sets;i++) sets.push({w:"",r:"",done:false,t:null});
    return {status:"todo", sets:sets};
  });
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function fmtTime(s){ var m=Math.floor(s/60), r=s%60; return m+":"+(r<10?"0":"")+r; }
function dayLabel(iso){
  var d=new Date(iso);
  return d.toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short"});
}
function clockLabel(iso){ return new Date(iso).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}); }
/* whole calendar days between a date and today (not 24-hour blocks) */
function daysAgo(iso){
  var a = new Date(iso), b = new Date();
  a.setHours(0,0,0,0); b.setHours(0,0,0,0);
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}
function localDate(iso){
  var d = new Date(iso); function z(n){ return (n<10?"0":"")+n; }
  return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
}
function relDate(iso){
  var days = daysAgo(iso);
  if (days<=0) return "today";
  if (days===1) return "yesterday";
  if (days<7) return days+" days ago";
  return dayLabel(iso);
}
function sameDay(iso){
  var a=new Date(iso), b=new Date();
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function stateBlob(){
  return {v:5, plan:S.plan, pos:S.pos, round:S.round, cycle:S.cycle, nextPlan:S.nextPlan, unit:S.unit,
          notes:S.notes, swaps:S.swaps, pbs:S.pbs, steps:S.steps, keepAwake:S.keepAwake, lastBackup:S.lastBackup,
          history:S.history,
          autoBackup:S.autoBackup, autoAsked:S.autoAsked, backupSnooze:S.backupSnooze, iconDone:S.iconDone,
          active:{plan:S.plan, pos:S.pos, extra:S.extra, started:S.started, log:S.log, warm:S.warm, parked:S.parked, rest:S.rest}};
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 350);
}
/* Writes now. If storage is full, older snapshots are given up one by one — your log never is. */
function flushSave(){
  clearTimeout(saveTimer); saveTimer = null;
  var blob = stateBlob();
  function attempt(){
    return writeStore(blob).then(function(ok){
      if (ok || STORE.mode !== "local" || !SNAPS.length) return ok;
      SNAPS.pop();
      return writeKey(SNAP_KEY, packSnaps()).then(attempt);
    });
  }
  return attempt().then(function(ok){ if (S.warn !== !ok){ S.warn = !ok; render(); } });
}
function doneSets(){ return S.log.reduce(function(a,l){ return a + l.sets.filter(function(s){return s.done;}).length; },0); }
function prevRecord(sid){
  for (var i=0;i<S.history.length;i++) if (S.history[i].sid===sid) return S.history[i];
  return null;
}
/* the same exercise in a past session — matched by name, so it works across splits */
function prevEx(rec, name, i){
  if (!rec || !rec.ex) return null;
  if (rec.ex[i] && rec.ex[i].n === name) return rec.ex[i];
  for (var k=0;k<rec.ex.length;k++) if (rec.ex[k].n === name) return rec.ex[k];
  return null;
}
/* most recent time this exercise was done in ANY session */
function lastAnywhere(name){
  for (var i=0;i<S.history.length;i++){
    var e = prevEx(S.history[i], name, -1);
    if (e && e.sets.some(function(x){ return x.w || x.done; })) return {rec:S.history[i], ex:e};
  }
  return null;
}
function setsText(ex){
  var done = ex.sets.filter(function(x){ return x.w || x.done; });
  if (!done.length) return "";
  return done.map(function(x){ return (x.w||"?")+"×"+(x.r||"?"); }).join("  ");
}
function planKeyOf(rec){ return (rec.plan||"LU")+"-"+rec.week+"-"+rec.day; }
function doneMap(){
  var m = {};
  S.history.forEach(function(r){ if (!r.extra && r.week && (r.cycle || 1) === S.cycle) m[planKeyOf(r)] = r.date; });
  return m;
}

/* heaviest number in a weight entry — "60/50" counts as 60 */
function heaviest(w){
  var nums = String(w||"").split("/").map(function(x){ return parseFloat(String(x).replace(",",".")); })
                          .filter(function(x){ return !isNaN(x); });
  return nums.length ? Math.max.apply(null, nums) : null;
}
/* best set ever logged for an exercise, scanned across the whole history */
function autoPB(name){
  if (isAssisted(name)) return null;
  var best = null;
  S.history.forEach(function(r){
    (r.ex||[]).forEach(function(e){
      if (e.n !== name) return;
      e.sets.forEach(function(st){
        if (!st.done && !st.w) return;
        var kg = heaviest(st.w);
        if (kg === null) return;
        if (!best || kg > best.kg) best = {kg:kg, r:st.r, date:r.date};
      });
    });
  });
  return best;
}
function pbLine(name){
  var man = S.pbs[name];
  if (man) return {text:man, manual:true};
  var a = autoPB(name);
  if (!a) return null;
  return {text:fmtW(a.kg)+" "+S.unit+(a.r?" × "+a.r:""), manual:false, date:a.date, kg:a.kg};
}
function warmItems(){
  if (!S.warm || !Array.isArray(S.warm.items) || S.warm.items.length !== WARMUP.length){
    var wasOpen = !!(S.warm && S.warm.open);
    S.warm = freshWarm(); S.warm.open = wasOpen;
  }
  return S.warm.items;
}

/* one-line "what you lifted last time", straight on the collapsed card */
function lastRef(e,i,prev){
  var pe = prevEx(prev, e.n, i);
  if (pe && setsText(pe)) return {ex:pe, rec:prev, elsewhere:false};
  var any = lastAnywhere(e.n);
  if (!any) return null;
  return {ex:any.ex, rec:any.rec, elsewhere: !(prev && any.rec.sid === prev.sid)};
}
function lastLine(ref){
  if (!ref) return '<span class="exLast">First time — no previous numbers yet</span>';
  return '<span class="exLast">'+dayLabel(ref.rec.date)+(ref.elsewhere?" ("+esc(ref.rec.name)+")":"")+
         ': <b>'+esc(setsText(ref.ex))+'</b> '+S.unit+(ref.ex.rpe ? ' · RPE '+rpeLabel(ref.ex.rpe) : '')+'</span>';
}
function rpeLabel(v){ return v <= 6 ? "≤6" : String(v); }

/* ------------------------- progression ---------------------------
   The program progresses by adding weight. Rule of thumb used here:
   - every set hit the prescribed reps, last set at or under target RPE → add one step
   - and it felt easy (2+ under target)                                → add two steps
   - all reps hit but last set harder than target                      → stay
   - missed reps                                                       → stay
   - missed by 3+ reps on a set                                        → drop one step
   Steps default to 5 kg on the big lower-body barbell lifts, 2.5 kg elsewhere,
   and each exercise's step can be changed by tapping it.                       */
var BIG_LOWER = {"Back Squat":1,"Deadlift":1,"Romanian Deadlift":1,"Barbell Hip Thrust":1,"Leg Press":1};
var STEP_OPTS = {kg:[1,1.25,2,2.5,5,10], lb:[2.5,5,10,20]};
function stepFor(e){
  if (STEP_OPTS[S.unit].indexOf(S.steps[e.n]) !== -1) return S.steps[e.n];
  var big = !!BIG_LOWER[e.n];
  return S.unit === "lb" ? (big ? 10 : 5) : (big ? 5 : 2.5);
}
function fmtW(x){ return String(Math.round(x*100)/100); }
/* on an assisted machine the number is help, not load — progress means less of it */
function isAssisted(name){ return /assisted/i.test(name || ""); }
function target(e, i, prev){
  if (prev === undefined) prev = prevRecord(current().sid);
  var ref = lastRef(e, i, prev);
  if (!ref) return null;
  var sets = ref.ex.sets.filter(function(x){ return x.done || x.w || x.r; });
  if (!sets.length) return null;
  var R = parseInt(String(e.reps).replace(/[^0-9]/g,""),10) || 0;
  var T = e.rpe, L = ref.ex.rpe || null, step = stepFor(e);
  var reps = sets.map(function(x){ return parseInt(x.r,10) || 0; });
  var W = null;
  sets.forEach(function(x){ var h = heaviest(x.w); if (h !== null && (W === null || h > W)) W = h; });
  var u = e.timed ? " sec" : " reps", rx = R + (e.timed ? " sec" : "");

  if (ref.elsewhere){
    if (W === null) return null;
    return {kind:"hold", w:fmtW(W), text:"start around "+fmtW(W)+" "+S.unit,
            why:"Your most recent "+e.n+" was in "+ref.rec.name+", with a different prescription — use it as a starting point."};
  }
  var hitAll = sets.length >= e.sets && reps.every(function(r){ return r >= R; });
  var badMiss = reps.some(function(r){ return r > 0 && r <= R - 3; });
  var hard = L !== null && L > T, easy = L !== null && L <= T - 2;
  var rpeNote = L !== null ? ", last set RPE "+rpeLabel(L)+" (target "+T+")" : "";

  if (W === null){                                 /* bodyweight or timed */
    if (!R) return null;
    if (hitAll && !hard){
      var add = e.timed ? 5 : 1;
      return {kind:"up", w:"", text:(R+add)+u+" per set",
              why:"You hit "+R+u+" on every set"+rpeNote+". Add "+add+(e.timed?" seconds":" rep")+" per set, or hold a light weight."};
    }
    return {kind:"hold", w:"", text:"aim for "+rx+u.replace(" sec","")+" every set",
            why: hitAll ? "All sets done, but the last one was RPE "+rpeLabel(L)+" — above the target of "+T+"." : "Not every set reached "+R+u+" last time."};
  }
  if (isAssisted(e.n)){
    if (hitAll && !hard){
      var na = easy ? 2 : 1, aw = Math.max(0, W - na*step);
      return {kind:"up", w:fmtW(aw), text:fmtW(aw)+" "+S.unit+" assist × "+rx,
              why:"Last time: "+R+u+" on every set with "+fmtW(W)+" "+S.unit+" of assistance"+rpeNote+". Take away "+fmtW(na*step)+" "+S.unit+" of help."};
    }
    if (badMiss){
      var ma = W + step;
      return {kind:"down", w:fmtW(ma), text:fmtW(ma)+" "+S.unit+" assist × "+rx,
              why:"A set fell 3+ reps short with "+fmtW(W)+" "+S.unit+" of assistance. Add one step of help and build back."};
    }
    return {kind:"hold", w:fmtW(W), text:"stay at "+fmtW(W)+" "+S.unit+" assist × "+rx,
            why: hitAll ? "Every rep done, but the last set was RPE "+rpeLabel(L)+" — above the target of "+T+"." : "Not every set reached "+R+u+" — get them all first."};
  }
  if (hitAll && !hard){
    var n = easy ? 2 : 1, nw = W + n*step;
    return {kind:"up", w:fmtW(nw), text:fmtW(nw)+" "+S.unit+" × "+rx,
            why:"Last time: "+R+u+" on every set at "+fmtW(W)+" "+S.unit+rpeNote+". "+
                (easy ? "It felt easy, so add two steps ("+fmtW(n*step)+" "+S.unit+")." : "Add one step ("+fmtW(step)+" "+S.unit+").")};
  }
  if (badMiss){
    var dw = Math.max(0, W - step);
    return {kind:"down", w:fmtW(dw), text:fmtW(dw)+" "+S.unit+" × "+rx,
            why:"A set fell 3+ reps short at "+fmtW(W)+" "+S.unit+". Drop one step and build back up."};
  }
  return {kind:"hold", w:fmtW(W), text:"stay at "+fmtW(W)+" "+S.unit+" × "+rx,
          why: hitAll ? "You got every rep, but the last set was RPE "+rpeLabel(L)+" — above the target of "+T+". Own this weight first."
                      : "Not every set reached "+R+u+" at "+fmtW(W)+" "+S.unit+" — get them all first."};
}
function nextLine(tg){
  if (!tg) return "";
  var arrow = tg.kind === "up" ? "↑" : (tg.kind === "down" ? "↓" : "→");
  return '<span class="exNext '+tg.kind+'"><i>'+arrow+'</i> Next: '+esc(tg.text)+'</span>';
}

/* What a tick logs when the weight box is empty — exactly the grey hint you see:
   a weight you typed on an earlier set today, else today's target, else last time's. */
function hintW(i, si){
  var e = current().ex[i], l = S.log[i];
  for (var k = si-1; k >= 0; k--) if (l.sets[k].w) return l.sets[k].w;
  if (e.bw && !l.showW) return "";
  var tg = target(e, i);
  if (tg && tg.w) return tg.w;
  var ref = lastRef(e, i, prevRecord(current().sid));
  if (ref && ref.ex.sets[si] && ref.ex.sets[si].w) return ref.ex.sets[si].w;
  return "";
}


/* ------------------------------ progress ------------------------------ */
var MUSCLES = ["Chest","Back","Shoulders","Biceps","Triceps","Quads","Hamstrings","Glutes","Calves","Abs"];   /* exercise-guide groups */
function weekStart(off){
  var d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay()+6) % 7) - 7*off);
  return d;
}
function doneCount(sets){ return sets.filter(function(x){ return x.done; }).length; }
/* Everything trained in one Monday–Sunday week: workouts, sets, minutes, and sets per muscle
   (1 per set for each main muscle, ½ for each helper), remembering which exercises they came from. */
function weekData(off){
  var a = weekStart(off).getTime(), b = weekStart(off-1).getTime();
  var out = {recs:[], sets:0, mins:0, mus:{}, live:false};
  function addM(id, name, v, helper){
    var e = out.mus[id] || (out.mus[id] = {v:0, ex:{}});
    e.v += v;
    var x = e.ex[name] || (e.ex[name] = {v:0, helper:helper});
    x.v += v;
  }
  function addEx(name, orig, k){
    if (!k) return;
    out.sets += k;
    var m = musclesOf(name, orig);
    m.p.forEach(function(id){ addM(id, name, k, false); });
    m.s.forEach(function(id){ addM(id, name, k/2, true); });
  }
  S.history.forEach(function(r){
    var t = new Date(r.date).getTime();
    if (t < a || t >= b) return;
    out.recs.push(r); out.mins += r.mins || 0;
    r.ex.forEach(function(e){ addEx(e.n, e.o, doneCount(e.sets)); });
  });
  var st = S.started ? new Date(S.started).getTime() : Date.now();
  if (off === 0 && S.log && st >= a && st < b && doneSets() > 0){
    out.live = true;
    var sess = current();
    S.log.forEach(function(l,i){ var e = sess.ex[i]; if (e) addEx(e.n, e.orig, doneCount(l.sets)); });
  }
  return out;
}
/* one programmed week of the split you're on, with your swaps applied */
function plannedSets(){
  var wk = planSession(S.plan, S.pos).week, out = {};
  PROGRAMS[S.plan][wk <= 4 ? "A" : "B"].forEach(function(d){
    d.ex.forEach(function(e){
      var m = musclesOf(S.swaps[e.n] || e.n, e.n);
      m.p.forEach(function(id){ out[id] = (out[id]||0) + e.sets; });
      m.s.forEach(function(id){ out[id] = (out[id]||0) + e.sets/2; });
    });
  });
  return out;
}
function bestE1(sets){
  var best = null;
  sets.forEach(function(st){
    if (!st.done) return;
    var w = heaviest(st.w), est = w === null ? null : e1rm(w, st.r);
    if (est !== null && (best === null || est > best)) best = est;
  });
  return best;
}
/* lifts whose best estimated 1RM that week beat every earlier week */
function weekPBs(off){
  var a = weekStart(off).getTime(), b = weekStart(off-1).getTime(), before = {}, during = {};
  S.history.forEach(function(r){
    var t = new Date(r.date).getTime();
    if (t >= b) return;
    var bag = t < a ? before : during;
    r.ex.forEach(function(e){
      if (isAssisted(e.n)) return;
      var v = bestE1(e.sets);
      if (v !== null && (bag[e.n] === undefined || v > bag[e.n])) bag[e.n] = v;
    });
  });
  return Object.keys(during).filter(function(n){ return before[n] !== undefined && during[n] > before[n] + 0.01; })
    .map(function(n){ return {n:n, now:Math.round(during[n]*10)/10, was:Math.round(before[n]*10)/10}; });
}
/* "▲ 8 vs last week" under a number; nothing when there's nothing to compare */
function deltaTag(d){
  if (!d) return '';
  return ' <em class="'+(d > 0 ? "up" : "dn")+'">'+(d > 0 ? "▲ " : "▼ ")+fmtSets(Math.abs(d))+'</em>';
}
function deltaLine(now, before){
  if (!before && !now) return '<i>&nbsp;</i>';
  if (!before) return '<i class="up">▲ '+fmtSets(now)+'</i>';
  if (now === before) return '<i>= same</i>';
  return '<i class="'+(now > before ? "up" : "dn")+'">'+(now > before ? "▲ " : "▼ ")+fmtSets(Math.abs(now-before))+'</i>';
}
function fmtSets(v){ v = Math.round(v*2)/2; return (v > 0 && v < 1) ? "½" : (v % 1 ? Math.floor(v)+"½" : String(v)); }
function fmtMins(m){ return m < 60 ? m+" min" : Math.floor(m/60)+" h "+(m%60 ? (m%60)+" min" : ""); }

function e1rm(w, r){ r = parseInt(r,10) || 0; if (!w || !r) return null; return r <= 1 ? w : w * (1 + r/30); }
function liftSeries(name){
  var pts = [];
  S.history.slice().reverse().forEach(function(rec){
    rec.ex.forEach(function(e){
      if (e.n !== name) return;
      var top = null, topR = 0, best = null;
      e.sets.forEach(function(st){
        if (!st.done && !st.w) return;
        var w = heaviest(st.w); if (w === null) return;
        var r = parseInt(st.r,10) || 0;
        if (top === null || w > top || (w === top && r > topR)){ top = w; topR = r; }
        var est = e1rm(w, r); if (est !== null && (best === null || est > best)) best = est;
      });
      if (top !== null) pts.push({t:new Date(rec.date).getTime(), date:rec.date, top:top, r:topR,
                                  e1: Math.round((best === null ? top : best)*10)/10});
    });
  });
  return pts;
}
function liftNames(){
  var seen = {}, out = [];
  S.history.forEach(function(rec){
    rec.ex.forEach(function(e){
      if (seen[e.n] || isAssisted(e.n)) return;
      if (e.sets.some(function(st){ return (st.done || st.w) && heaviest(st.w) !== null; })){ seen[e.n] = 1; out.push(e.n); }
    });
  });
  return out;
}
function shortDate(iso){ return new Date(iso).toLocaleDateString(undefined,{day:"numeric", month:"short"}); }
function niceStep(range){
  var raw = Math.max(range, 1) / 4, mag = Math.pow(10, Math.floor(Math.log(raw)/Math.LN10)), f = raw / mag;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
}

/* chart colours — validated (dataviz validate_palette.js) against the #171C24 sheet surface */
var C_TOP = "#3987e5", C_E1 = "#d95926", C_SURF = "#171C24", C_GRID = "#2C3644", C_MUTED = "#8A94A3", C_INK = "#EDEFF2";
var CHART = null;

function liftChart(pts){
  var W = 340, H = 200, ml = 36, mr = 40, mt = 18, mb = 26, pw = W-ml-mr, ph = H-mt-mb;
  var lo = Math.min.apply(null, pts.map(function(p){ return p.top; }));
  var hi = Math.max.apply(null, pts.map(function(p){ return p.e1; }));
  if (hi - lo < 4){ hi += 2; lo -= 2; }
  var step = niceStep(hi - lo);
  lo = Math.max(0, Math.floor(lo/step)*step); hi = Math.ceil(hi/step)*step;
  var t0 = pts[0].t, t1 = pts[pts.length-1].t, byIdx = (t1 - t0) < 3600000;
  function X(p, k){
    if (pts.length === 1) return ml + pw/2;
    return byIdx ? ml + k/(pts.length-1)*pw : ml + (p.t - t0)/(t1 - t0)*pw;
  }
  function Y(v){ return mt + ph - (v - lo)/(hi - lo)*ph; }
  var xs = pts.map(X);
  var g = '<svg id="liftSvg" class="liftSvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Top set and estimated one-rep max over time">';
  for (var v = lo; v <= hi + 1e-9; v += step){
    var y = Y(v).toFixed(1);
    g += '<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y+'" y2="'+y+'" stroke="'+C_GRID+'" stroke-width="1"/>'+
         '<text x="'+(ml-6)+'" y="'+(+y+3.5)+'" text-anchor="end" class="axis">'+fmtW(v)+'</text>';
  }
  var lab = [0]; if (pts.length > 1) lab.push(pts.length-1);
  var mid = Math.floor((pts.length-1)/2);
  if (pts.length >= 5 && xs[mid] - xs[0] > 70 && xs[pts.length-1] - xs[mid] > 70) lab.splice(1, 0, mid);
  lab.forEach(function(k, n){
    var anchor = pts.length === 1 ? "middle" : (n === 0 ? "start" : (k === pts.length-1 ? "end" : "middle"));
    g += '<text x="'+xs[k].toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+anchor+'" class="axis">'+esc(shortDate(pts[k].date))+'</text>';
  });
  function line(key, col){
    if (pts.length < 2) return "";
    return '<polyline fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+
           pts.map(function(p,k){ return xs[k].toFixed(1)+","+Y(p[key]).toFixed(1); }).join(" ")+'"/>';
  }
  g += line("e1", C_E1) + line("top", C_TOP);
  g += '<line id="xh" x1="0" x2="0" y1="'+mt+'" y2="'+(mt+ph)+'" stroke="'+C_MUTED+'" stroke-width="1" visibility="hidden"/>';
  pts.forEach(function(p,k){
    g += '<circle cx="'+xs[k].toFixed(1)+'" cy="'+Y(p.e1).toFixed(1)+'" r="4" fill="'+C_E1+'" stroke="'+C_SURF+'" stroke-width="2"/>'+
         '<circle cx="'+xs[k].toFixed(1)+'" cy="'+Y(p.top).toFixed(1)+'" r="4" fill="'+C_TOP+'" stroke="'+C_SURF+'" stroke-width="2"/>';
  });
  /* PB: best estimated 1RM */
  var pb = 0; pts.forEach(function(p,k){ if (p.e1 >= pts[pb].e1) pb = k; });
  var pbx = xs[pb], pby = Y(pts[pb].e1);
  g += '<circle cx="'+pbx.toFixed(1)+'" cy="'+pby.toFixed(1)+'" r="7.5" fill="none" stroke="'+C_INK+'" stroke-width="1.5"/>'+
       '<text x="'+Math.min(Math.max(pbx, ml+10), W-mr-10).toFixed(1)+'" y="'+Math.max(pby-12, 10).toFixed(1)+'" text-anchor="middle" class="pbTxt">PB</text>';
  /* end labels, only when they don't collide */
  var L = pts.length-1, yT = Y(pts[L].top), yE = Y(pts[L].e1), eOff = (pb === L ? 12 : 9);
  if (Math.abs(yT - yE) >= 13){
    g += '<text x="'+(xs[L]+eOff).toFixed(1)+'" y="'+(yE+3.5).toFixed(1)+'" class="endTxt">'+fmtW(pts[L].e1)+'</text>'+
         '<text x="'+(xs[L]+9).toFixed(1)+'" y="'+(yT+3.5).toFixed(1)+'" class="endTxt">'+fmtW(pts[L].top)+'</text>';
  }
  g += '<rect id="hit" x="'+ml+'" y="0" width="'+pw+'" height="'+H+'" fill="transparent"/></svg>';
  CHART = {pts:pts, xs:xs, W:W};
  return g;
}
function readoutText(p){
  return dayLabel(p.date)+" · top set "+fmtW(p.top)+" "+S.unit+(p.r ? " × "+p.r : "")+" · est. 1RM "+fmtW(p.e1)+" "+S.unit;
}
function bindChart(){
  var svg = document.getElementById("liftSvg"), out = document.getElementById("readout"), xh = document.getElementById("xh");
  if (!svg || !CHART || !out) return;
  function at(ev){
    var r = svg.getBoundingClientRect(), vx = (ev.clientX - r.left) / r.width * CHART.W, k = 0;
    CHART.xs.forEach(function(x, j){ if (Math.abs(x - vx) < Math.abs(CHART.xs[k] - vx)) k = j; });
    xh.setAttribute("x1", CHART.xs[k]); xh.setAttribute("x2", CHART.xs[k]); xh.setAttribute("visibility", "visible");
    out.textContent = readoutText(CHART.pts[k]);
  }
  svg.addEventListener("pointerdown", at);
  svg.addEventListener("pointermove", at);
}

function tickRest(){
  if (!S.rest) return;
  var left = Math.max(0, Math.ceil((S.rest.end - Date.now())/1000));
  var t = document.getElementById("restTime"), lb = document.getElementById("restLabel"), bar = document.getElementById("restBar");
  if (t) t.textContent = fmtTime(left);
  var hold = S.rest.kind === "hold";
  if (lb) lb.textContent = left===0 ? (hold ? "Time — hold done" : "Rest is over — next set")
                                    : (hold ? "Holding · " : "Resting · ") + S.rest.label;
  if (bar) bar.className = "restBar" + (left===0 ? " up" : "");
  if (left===0 && !beeped){ beeped = true; beep(); }
}
function rpeChips(i, src, tgt){
  var cur = src === "dock" ? null : S.log[i].rpe;
  return [6,7,8,9,10].map(function(v){
    return '<button class="chip'+(cur===v?" on":"")+(v===tgt?" tgt":"")+'" data-act="rpe" data-src="'+src+'"'+
           (i!==null?' data-i="'+i+'"':'')+' data-v="'+v+'">'+rpeLabel(v)+'</button>';
  }).join("");
}

/* --------------------- fixing a past workout --------------------- */
function histEditHTML(d){
  var h = '<div class="logBody editing"><p class="hint" style="margin:0 0 8px">Fix any weight or rep, tick sets on or off, then save. Charts, bests and next targets update straight away.</p>';
  d.ex.forEach(function(e, ei){
    h += '<div class="hEx"><b>'+esc(e.n)+'</b>';
    if (e.status === "flag"){
      h += '<span class="miss">marked as couldn\'t do it</span><button class="miniBtn" data-act="histUnflag" data-e="'+ei+'">Log sets instead</button></div>';
      return;
    }
    e.sets.forEach(function(st, si){
      h += '<div class="hSet'+(st.done?" on":"")+'"><span>'+(si+1)+'</span>'+
           '<input inputmode="decimal" data-f="hw" data-e="'+ei+'" data-s="'+si+'" value="'+esc(st.w||"")+'" placeholder="–" aria-label="Weight">'+
           '<i>'+S.unit+' ×</i>'+
           '<input inputmode="numeric" data-f="hr" data-e="'+ei+'" data-s="'+si+'" value="'+esc(st.r||"")+'" placeholder="–" aria-label="Reps">'+
           '<button class="tick sm'+(st.done?" on":"")+'" data-act="histTick" data-e="'+ei+'" data-s="'+si+'" aria-label="Set done">✓</button></div>';
    });
    h += '<div class="hRpe"><span>Last-set RPE</span><div class="chips">'+[6,7,8,9,10].map(function(v){
           return '<button class="chip sm'+(e.rpe===v?" on":"")+'" data-act="histRpe" data-e="'+ei+'" data-v="'+v+'">'+rpeLabel(v)+'</button>';
         }).join("")+'</div></div></div>';
  });
  return h + '<div class="btnRow"><button class="ghostBtn solidBtn" data-act="histSave">Save changes</button>'+
             '<button class="ghostBtn" data-act="histCancel">Cancel</button></div></div>';
}
function saveHistEdit(){
  var ed = S.editHist; if (!ed) return;
  var rec = ed.rec;
  snapshot("before editing a workout");
  ed.draft.ex.forEach(function(e){
    if (e.status === "flag") return;
    e.sets.forEach(function(st){ if (st.done && !st.t) st.t = rec.date; if (!st.done) st.t = null; });
    e.status = e.sets.some(function(st){ return st.done; }) ? "done" : "skip";
  });
  rec.ex = ed.draft.ex;                 /* same record object, so Undo and the RPE prompt still find it */
  S.editHist = null;
  S.note = "Saved your changes to "+rec.name+" ("+dayLabel(rec.date)+").";
  render(); renderModal(); save();
}
function deleteHist(rec){
  var k = S.history.indexOf(rec);
  if (k === -1) return;
  snapshot("before deleting a workout");
  S.history.splice(k, 1);
  if (S.undo && S.undo.rec === rec) S.undo = null;
  if (S.rpeAsk && S.rpeAsk.hist === rec.date) S.rpeAsk = null;
  S.delHist = null; S.openHist = null;
  S.note = "Deleted "+rec.name+" from "+dayLabel(rec.date)+". Changed your mind? Settings → Safety snapshots.";
  render(); renderDock(); renderModal(); save();
}

function storeLine(){
  if (STORE.mode==="claude") return {ok:!S.warn, text:"Saved in your Claude account. It follows your login, not this phone. Works only while this artifact is published and your plan includes artifact storage."};
  if (STORE.mode==="local") return {ok:!S.warn, text:"Saved in this browser on this device. No account needed — but clearing website data erases it, so keep a backup."};
  return {ok:false, text:"Not saving anywhere. Copy your data out below before you close this."};
}

/* Redraws whichever sheet is open. Re-drawing the same sheet keeps its scroll position,
   so tapping something halfway down never throws you back to the top. */
/* read (no argument) or set the open sheet's scroll position */
function sheetScroll(to){
  var sh = modalEl.querySelector(".sheet");
  if (!sh) return 0;
  if (to !== undefined) sh.scrollTop = to;
  return sh.scrollTop;
}
function renderModal(){
  var old = modalEl.querySelector(".sheet"), top = old ? old.scrollTop : 0;
  var was = modalEl.getAttribute("data-kind") || "";
  var out = modalContent();
  modalEl.innerHTML = out.html;
  modalEl.setAttribute("data-kind", out.kind);
  var sheet = modalEl.querySelector(".sheet");
  if (sheet && out.kind === was) sheet.scrollTop = top;
  if (out.kind === "progress") bindChart();
}
/* --------------------------- exercise guide --------------------------- */
function guideMatches(g, q){
  if (!q) return true;
  q = q.toLowerCase();
  return [g.n, g.g].concat(g.a || [], g.pm.concat(g.sm).map(function(id){ return MUS[id]; }))
    .some(function(x){ return x.toLowerCase().indexOf(q) !== -1; });
}
function guideListHTML(){
  var q = S.guide.q.trim(), h = "", n = 0;
  MUSCLES.forEach(function(m){
    var list = GUIDE.filter(function(g){ return g.g === m && guideMatches(g, q); });
    if (!list.length) return;
    n += list.length;
    h += '<div class="gGroup">'+m+'</div>';
    list.forEach(function(g){
      h += '<button class="gRow" data-act="guideSel" data-n="'+esc(g.n)+'"><span><b>'+esc(g.n)+'</b><i>'+esc(musLine(g))+'</i></span>'+
           (IN_PROGRAM[g.n] ? '<small>program</small>' : '')+'</button>';
    });
  });
  return n ? h : '<p class="hint">Nothing matches “'+esc(q)+'”. Try a muscle like “chest” or part of a name.</p>';
}
function guideDetailHTML(g){
  var h = '<div class="gHead">'+artSVG(g.art)+'<div><h2>'+esc(g.n)+'</h2><span class="gTag">'+g.g+(IN_PROGRAM[g.n]?' · in the program':'')+'</span></div></div>'+
    '<p class="gCue">'+esc(g.c)+'</p>'+
    (g.pm.length ? '<div class="gMus">'+bodySVG(function(id){ return g.pm.indexOf(id) !== -1 ? 4 : (g.sm.indexOf(id) !== -1 ? 2 : 0); },
        {small:true, label:"Muscles this exercise works"})+
      '<div class="gMusTxt"><span>Muscles</span><p><i class="mk" style="background:'+MUS_SHADE[4]+'"></i><b>Main:</b> '+esc(musText(g.pm))+'</p>'+
      (g.sm.length ? '<p><i class="mk" style="background:'+MUS_SHADE[2]+'"></i><b>Helps:</b> '+esc(musText(g.sm))+'</p>' : '')+'</div></div>' : '')+
    '<div class="gSec"><span>Setup</span><p>'+esc(g.s)+'</p></div>'+
    '<div class="gSec"><span>Do it</span><ol>'+g.d.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ol></div>';
  if (g.m) h += '<div class="gSec"><span>Common mistakes</span><p>'+esc(g.m)+'</p></div>';
  if (g.h.length){
    h += '<div class="gSec hurt"><span>If it hurts</span>'+
         g.h.map(function(x){ return '<p><b>'+esc(x[0])+'</b> — '+esc(x[1])+'</p>'; }).join("")+
         '<p class="gWarn">Sharp or lingering pain: stop and get it checked.</p></div>';
  }
  h += '<a class="ghostBtn wide gDemo" target="_blank" rel="noreferrer" href="'+esc(demoURL(g.n))+'">Search YouTube for a demo</a>';
  if (g.v) h += '<a class="jeffLink" target="_blank" rel="noreferrer" href="'+esc(g.v)+'">Or watch Jeff\'s video from the program ›</a>';
  var alts = ALT[g.n];
  if (alts){
    h += '<div class="gSec"><span>Alternatives</span><div class="gChips">'+
         alts.map(function(a){ var nm = a.replace(/\*$/,""), ag = guideFor(nm);
           return ag ? '<button class="chipLink" data-act="guideSel" data-n="'+esc(ag.n)+'">'+esc(nm)+'</button>' : ''; }).join("")+
         '</div></div>';
  }
  return h + '<button class="ghostBtn wide" data-act="guideClose">Close</button>';
}
function guideHTML(){
  var g = guideFor(S.guide.sel);
  if (g) return guideDetailHTML(g);
  return '<h2>Exercise guide</h2>'+
    '<input id="guideQ" class="gSearch" type="search" placeholder="Search exercises or muscles" value="'+esc(S.guide.q)+'" autocomplete="off">'+
    '<div id="guideList">'+guideListHTML()+'</div>'+
    '<button class="ghostBtn wide" data-act="guideClose">Close</button>';
}

/* a drawn ✕, so it sits dead centre in its circle whatever the font */
var ICON_X = '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>';
/* back (optional) = [action, label] for a pinned "‹ Back" in the top bar */
function wrapSheet(kind, closeAct, inner, back){
  return {kind:kind, html:'<div class="sheetWrap" data-act="'+closeAct+'"><div class="sheet" data-close="'+closeAct+'">'+
    '<div class="sheetTop"><div class="sheetBar"></div>'+
    (back ? '<button class="sheetBack" data-act="'+back[0]+'">‹ '+esc(back[1])+'</button>' : '')+
    '<button class="sheetX" data-act="'+closeAct+'" aria-label="Close">'+ICON_X+'</button></div>'+
    inner+'</div></div>'};

function modalContent(){
  /* --- confirm before throwing away logged sets --- */
  if (S.pending){
    var pd = S.pending, n = doneSets(), title, body, go;
    if (pd.kind === "jump"){
      title = "Switch to "+esc(planSession(S.plan, pd.p).name)+"?";
      body = "Switching clears them, because only finished workouts go into your history.";
      go = "Switch and clear";
    } else if (pd.kind === "extra"){
      title = "Start "+esc(PROGRAMS[S.pick.plan][S.pick.block][pd.day-1].name)+" instead?";
      body = "Starting another extra day clears them. Tap Finish first if you want to keep them.";
      go = "Start and clear";
    } else {
      title = "Leave this extra day?";
      body = "Going back to your plan clears them. Tap Finish instead to save them.";
      go = "Leave and clear";
    }
    return wrapSheet("pending", "cancelPending", '<h2>'+title+'</h2>'+
      '<p class="hint">You\'ve logged '+n+' set(s) here. '+body+'</p>'+
      '<button class="danger" data-act="confirmPending">'+go+'</button>'+
      '<button class="ghostBtn wide" data-act="cancelPending">Keep going here</button>');
  }
  /* --- swap an exercise --- */
  if (S.swapFor !== null && S.swapFor !== undefined){
    var se = current().ex[S.swapFor], orig = baseName(se), opts = ALT[orig] || [];
    var og = guideFor(orig);
    var hs = '<h2>Swap '+esc(orig)+'</h2>'+
      (og && og.pm.length ? '<p class="swapMus">Works: <b>'+esc(musText(og.pm))+'</b></p>' : '')+
      '<p class="hint">Same sets, reps, RPE and rest — only the movement changes. Your choice sticks until you change it back.</p>'+
      '<div class="dayList">';
    opts.forEach(function(o){
      var official = o.slice(-1) === "*", nm = official ? o.slice(0,-1) : o;
      hs += '<button class="dayBtn'+(S.swaps[orig]===nm?" picked":"")+'" data-act="swapTo" data-n="'+esc(nm)+'">'+
            '<span class="optTxt"><b>'+esc(nm)+'</b>'+(guideFor(nm) && guideFor(nm).pm.length ? '<em>'+esc(musText(guideFor(nm).pm))+'</em>' : '')+
            (guideFor(nm)?'<i>'+esc(guideFor(nm).c)+'</i>':'')+'</span>'+
            (official?'<small class="star">in the manual</small>':'')+'</button>';
    });
    hs += '</div><label class="miniField" style="margin-top:12px"><span>Or type your own</span>'+
      '<input id="swapCustom" placeholder="e.g. Hack Squat" value=""></label>'+
      '<button class="ghostBtn wide" data-act="swapCustom">Use that instead</button>'+
      (S.swaps[orig] ? '<button class="danger" data-act="swapClear">Back to '+esc(orig)+'</button>' : '')+
      '<button class="ghostBtn wide" data-act="closeSwap">Cancel</button>';
    return wrapSheet("swap", "closeSwap", hs);
  }

  if (S.prog.open) return wrapSheet("progress", "progClose", progressHTML());
  if (S.guide.open) return wrapSheet("guide:"+(S.guide.sel || ""), "guideClose", guideHTML(), S.guide.sel ? ["guideBack", "All exercises"] : null);

  /* --- erase everything: confirm first --- */
  if (S.confirmErase){
    return wrapSheet("erase", "cancelErase", '<h2>Erase all data?</h2>'+
      '<p class="hint">This deletes '+S.history.length+' finished workout(s), plus your machine notes, swaps, personal bests and progression steps.</p>'+
      '<p class="hint">A snapshot is saved first, so you can still bring it all back from Settings → Safety snapshots — as long as Safari\'s website data isn\'t cleared.</p>'+
      '<p class="hint">Just want to restart the plan? Use <b>Jump to a workout → W1</b> instead. It keeps your history.</p>'+
      (S.note ? '<p class="hint ok">'+esc(S.note)+'</p>' : '')+
      '<button class="ghostBtn wide" data-act="dlJson">Download a backup first</button>'+
      '<button class="danger" data-act="eraseAll">Erase everything</button>'+
      '<button class="ghostBtn wide" data-act="cancelErase">Keep my data</button>');
  }

  /* --- switching split mid-cycle --- */
  if (S.switchTo){
    var np = PROGRAMS[S.switchTo], here = planSession(S.plan, S.pos);

        '<small>a fresh 8-week cycle</small></button>'+
      '</div><button class="ghostBtn wide" data-act="cancelSwitch">Cancel</button>');

  if (!S.sheet) return {kind:"", html:""};

  /* --- extra session --- */

    h += '<button class="'+(S.pick.plan===k?"on":"")+'" data-act="pickPlan" data-k="'+k+'">'+esc(PROGRAMS[k].short)+'</button>';

  h += '</div><div class="seg full" style="margin-top:6px">'+

       '</div><div class="dayList">';
  PROGRAMS[S.pick.plan][S.pick.block].forEach(function(d,i){
    var r = prevRecord(S.pick.plan+"-"+S.pick.block+"-"+(i+1));
    h += '<button class="dayBtn" data-act="startExtra" data-d="'+(i+1)+'"><span>'+esc(d.name)+'</span>'+
         '<small>'+(r ? "last done "+dayLabel(r.date) : d.ex.length+" exercises")+'</small></button>';

    h += '<button class="'+(S.plan===k?"on":"")+'" data-act="switchPlan" data-k="'+k+'">'+esc(PROGRAMS[k].short)+'</button>';

  /* --- active swaps --- */
  var swapKeys = Object.keys(S.swaps);
  if (swapKeys.length){
    h += '<div class="setting col"><span>Your swaps ('+swapKeys.length+')</span><div class="dayList">';
    swapKeys.forEach(function(k){
      h += '<button class="dayBtn" data-act="swapClearOne" data-n="'+esc(k)+'"><span>'+esc(k)+' → '+esc(S.swaps[k])+'</span>'+
           '<small>tap to undo</small></button>';
    });

       'Save a backup outside this phone every week or so — it\'s the only copy that survives Safari clearing its data.</p>'+
       '<div class="btnRow">'+
